term=xterm-256color

font=JetBrainsMono Nerd Font:size=9
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=9

pad=14x14

[cursor]

[colors-dark]
foreground=a9b1d6
background=1a1b26

cursor=1a1b26 c0caf5

regular0=32344a  # black
regular1=f7768e  # red
regular2=9ece6a  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=ad8ee6  # magenta
regular6=449dab  # cyan
regular7=787c99  # white

bright0=444b6a
bright1=ff7a93
bright2=b9f27c
bright3=ff9e64
bright4=7da6ff
bright5=bb9af7
bright6=0db9d7
bright7=acb0d0

selection-foreground=c0caf5
selection-background=7aa2f7

search-box-match=1a1b26 e0af68
search-box-no-match=1a1b26 f7768e

[key-bindings]
clipboard-copy=Control+Insert
primary-paste=none
clipboard-paste=Shift+Insert
